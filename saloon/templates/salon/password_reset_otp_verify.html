{% extends "salon/base.html" %}

{% block title %}Verify OTP{% endblock %}

{% block content %}
<section class="auth-wrap">
  <h2>Verify OTP</h2>
  <p class="hint">Enter OTP received on your registered mobile and set a new password.</p>
  <form method="post" class="form-card">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Reset Password</button>
  </form>
  <p style="margin-top:8px;"><a href="{% url 'password_reset_otp_request' %}">Request new OTP</a></p>
</section>
{% endblock %}
