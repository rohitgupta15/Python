{% extends "salon/base.html" %}

{% block title %}Password Reset OTP{% endblock %}

{% block content %}
<section class="auth-wrap">
  <h2>Reset Password via OTP</h2>
  <p class="hint">Send OTP to your registered mobile number using SMS or WhatsApp.</p>
  <form method="post" class="form-card">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Send OTP</button>
  </form>
  <p style="margin-top:8px;"><a href="{% url 'login' %}">Back to login</a></p>
</section>
{% endblock %}
