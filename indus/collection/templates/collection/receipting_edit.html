<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update Payment</title>
    <style>
      body { margin: 0; font-family: "Georgia", "Times New Roman", serif; background: #f6f7fb; }
      .wrap { max-width: 720px; margin: 40px auto; background: #fff; padding: 22px; border-radius: 14px; border: 1px solid #e2e8f0; }
      h1 { margin: 0 0 10px 0; font-size: 22px; }
      label { display: block; margin-top: 10px; color: #475569; font-size: 13px; }
      input, textarea { width: 100%; margin-top: 6px; padding: 10px 12px; border-radius: 10px; border: 1px solid #e2e8f0; font-family: "Arial", sans-serif; }
      textarea { min-height: 80px; }
      .actions { margin-top: 16px; display: flex; gap: 10px; }
      .btn { padding: 9px 14px; border-radius: 10px; border: 0; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 13px; }
      .btn-primary { background: #1d4ed8; color: #fff; }
      .btn-outline { background: #fff; border: 1px solid #e2e8f0; color: #0f172a; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Update Payment</h1>
      <p>Editing: <strong>{{ payment.payer_name }}</strong></p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <a class="btn btn-outline" href="/receipting/">Cancel</a>
        </div>
      </form>
    </div>
  </body>
</html>
