<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f3f3;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .main {
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            padding: 20px;
            width: 300px;
        }

        .main h2 {
            color: #4caf50;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button[type="submit"] {
            padding: 15px;
            border-radius: 10px;
            border: none;
            background-color: #4caf50;
            color: white;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
    </style>
</head>

<body>
 
    <div class="main">
        <h2>Receipe Form</h2>
        <form action="" method="POST" enctype="multipart/form-data"> 
            {% csrf_token %}
            <label for="receipe_name">Receipe Name:</label>
            <input type="text" class="form-control" name="receipe_name" required />

            <label for="receipe_desc">Receipe Desc:</label>
            <textarea class="form-control" name="receipe_desc">  </textarea>

            
            <label for="receipe_img">Receipe Desc:</label>
            <input type="file" class="form-control" name="receipe_img" />



            <button type="submit">
                Submit
            </button>
        </form>
    </div>
    <div>
      <!-- {{receipe}}--> 

        <table class="table" class="table caption-top">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Receipt_name</th>
                <th scope="col">receipe_desc</th>
                <th scope="col">Receipt_image</th>
              </tr>
            </thead>
            <tbody>
                {%for rec in receipe %}
              <tr>
                <th scope="row">{{forloop.counter}}</th>
                <td>{{rec.receipe_name}}</td>
                <td>{{rec.receipe_desc}}</td>
                <td><img src="/static/{{rec.receipe_img}}" style="height: 30px"></td>
              </tr>
                {% endfor %}
            </tbody>
          </table>

    </div>
</body>

</html>
